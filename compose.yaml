# Local development stack.
#
#   docker compose up -d                       SQL Server only; run and debug the API from Rider
#   docker compose --profile app up --build    SQL Server + the API (http://localhost:5055/swagger)
#   docker compose down                        stop (the data is kept in the sqlserver-data volume)
#   docker compose down -v                     stop and delete the database
#
# The SQL Server password comes from .env (copy .env.example).

name: pulsewallet

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/PulseWallet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TrustServerCertificate: the development SQL Server uses a self-signed certificate.
      ConnectionStrings__PulseWallet: "Server=sqlserver,1433;Database=PulseWallet;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "5055:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
